<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<title>Folheto Digital – Ofertas de Novembro</title>
<style>
:root{--bg:#5c0a2b;--card:#ffffff14;--ink:#fff;--mut:#ffffffb3;--acc:#fff;--acc2:#d4375c;--line:#ffffff2e;--on:#5c0a2b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-t=escola]{--bg:#f6f1f2;--card:#fff;--ink:#26262a;--mut:#6b6b73;--acc:#8a1a2b;--acc2:#2b4a8a;--line:#e3d6d9;--on:#fff}
[data-t=dd]{--bg:#0b0b0c;--card:#1a1a1d;--ink:#f4f4f6;--mut:#a4a4ad;--acc:#e3e3ea;--acc2:#8f8f9c;--line:#2e2e33;--on:#0b0b0c}
[data-t=pge]{--bg:#5c0a2b;--card:#ffffff14;--ink:#fff;--mut:#ffffffb3;--acc:#fff;--acc2:#e0506f;--line:#ffffff2e;--on:#5c0a2b}
[data-t=trib]{--bg:#f4f4f5;--card:#fff;--ink:#26262a;--mut:#6b6b73;--acc:#b41828;--acc2:#383838;--line:#e1e1e5;--on:#fff}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;min-height:100vh;transition:background .35s,color .35s}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs button{flex:1 0 auto;border:1px solid var(--line);background:transparent;color:var(--mut);padding:9px 12px;border-radius:999px;font:600 13px inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--acc);color:var(--on);border-color:var(--acc)}
.brand{display:flex;align-items:center;gap:14px;margin:22px 0 16px}
.brand img{width:76px;height:76px;border-radius:50%;object-fit:cover;border:2px solid var(--line);background:#000}
.wm{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--acc);color:var(--acc);font:800 15px/1 inherit;text-align:center;letter-spacing:.5px}
.brand h1{font-size:24px;line-height:1.1;margin:0}.brand p{margin:4px 0 0;color:var(--mut);font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:18px}
.seg button{border:0;background:transparent;color:var(--mut);padding:11px 6px;border-radius:10px;font:700 14px inherit;font-family:inherit;cursor:pointer}
.seg button[aria-selected=true]{background:var(--acc);color:var(--on)}
.hero{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on);border-radius:20px;padding:22px 20px;margin-bottom:18px}
.hero small{opacity:.85;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:11px}
.hero h2{margin:6px 0 10px;font-size:22px;line-height:1.2}
.chip{display:inline-block;background:#00000026;border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px}
[data-t=escola] .hero,[data-t=dd] .hero{color:#fff}
[data-t=dd] .hero{color:#0b0b0c}
.step{position:relative;margin:0 0 12px 22px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;transition:transform .15s}
.step:hover{transform:translateX(3px)}
.step:before{content:"";position:absolute;left:-22px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px var(--line)}
.step:after{content:"";position:absolute;left:-17px;top:34px;bottom:-20px;width:2px;background:var(--line)}
.step:last-of-type:after{display:none}
.step h3{margin:0;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.step h3 span{color:var(--acc);font-size:12px}
.step ul{list-style:none;margin:10px 0 0;padding:0;display:none}
.step.open ul{display:block}
.step li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.35}
.step li b{font-size:17px}
.last h3{color:var(--mut)}
.nota{color:var(--mut);font-size:12px;margin:6px 0 16px}
.offers{display:grid;gap:12px}
.off{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;align-items:center;gap:18px}
.pct{font-size:52px;font-weight:900;line-height:1;color:var(--acc);min-width:112px}
.pct sup{font-size:22px}
.off p{margin:0;color:var(--mut);font-size:13px}.off strong{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.novit{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:18px;color:var(--mut);margin-bottom:12px}
.copy{width:100%;margin-top:18px;border:1px solid var(--acc);background:transparent;color:var(--acc);padding:13px;border-radius:14px;font:700 14px inherit;font-family:inherit;cursor:pointer}
.copy:not([disabled]):hover{background:var(--acc);color:var(--on)}
.copy[disabled]{opacity:.5;cursor:not-allowed}
.brand.wide{flex-wrap:wrap}
.logo-w{height:76px;max-width:100%;padding:8px 14px;border-radius:16px;background:#fff;border:2px solid var(--line);display:flex;align-items:center;flex:0 0 auto}
.logo-w img{height:100%;width:auto;max-width:100%;border-radius:0;border:0;background:none;object-fit:contain}
.brand.wide h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0}
.obs{margin-top:14px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:16px;padding:16px 18px;font-size:14px;line-height:1.5}
.obs b{display:block;margin-bottom:6px;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--acc)}
.obs .obs2{margin:10px 0 0;font-weight:600}
.obs .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.obs .tags span{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.lock{text-align:center;padding:32px 18px;line-height:1.5}.lock b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
</style></head><body data-t="escola"><div class="wrap">
